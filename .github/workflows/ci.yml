name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: benzpos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d benzpos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/benzpos_ci?schema=public
      JWT_SECRET: ci-only-long-random-secret-for-checks
      NODE_ENV: test
      AUDIT_LOG_FILE: /tmp/benzpos-audit.log
      SLOW_REQUEST_MS: "1000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser for E2E
        run: npx playwright install --with-deps chromium

      - name: Verify production readiness
        run: npm run ci:verify
