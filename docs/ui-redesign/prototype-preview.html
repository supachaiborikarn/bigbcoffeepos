  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

#branch-studios *{box-sizing:border-box}
#branch-studios [hidden]{display:none!important}
#branch-studios button,#branch-studios input,#branch-studios select{font:inherit}
#branch-studios button{cursor:pointer}
#branch-studios button:focus-visible,#branch-studios input:focus-visible,#branch-studios select:focus-visible{outline:3px solid var(--focus,#5d9b7f);outline-offset:3px}
#branch-studios .preview-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:0 0 14px}
#branch-studios .preview-label{font-size:12px;color:light-dark(#61695f,#b6c4b9)}
#branch-studios .preview-tabs{display:flex;gap:6px;flex-wrap:wrap}
#branch-studios .preview-tabs button{min-height:44px;border:1px solid light-dark(#dedfd8,#37473d);border-radius:10px;background:transparent;color:inherit;padding:9px 12px;font-size:12px}
#branch-studios .preview-tabs button[aria-pressed=true]{background:light-dark(#253e32,#dbeadf);color:light-dark(#fff,#173324);border-color:transparent}
#branch-studios .studio{--canvas:light-dark(#f4f1eb,#14211a);--paper:light-dark(#fffcf7,#1e2d24);--panel:light-dark(#fff,#23332a);--ink:light-dark(#23382c,#eef3ec);--muted:light-dark(#667165,#b4c2b2);--line:light-dark(#e7e7dc,#3b4a3d);--brand:light-dark(#163d32,#b6d4b7);--onbrand:light-dark(#fff,#182c20);--soft:light-dark(#e9eee4,#2c4030);--accent:light-dark(#b85d3c,#e4a889);--rail:light-dark(#163b2d,#0b1810);--railtext:#ebf0e7;--railmuted:#bed1bf;--photo:#f4f1eb;--focus:#82ae88;display:grid;grid-template-columns:80px minmax(0,1fr);background:var(--canvas);color:var(--ink);border:1px solid var(--line);border-radius:20px;overflow:clip;box-shadow:0 14px 36px light-dark(#23382c0b,#00000025)}
#branch-studios .studio[data-branch=oil]{--canvas:light-dark(#f1f3f5,#161c23);--paper:light-dark(#f9fafb,#1c252e);--panel:light-dark(#fff,#222e39);--ink:light-dark(#17212b,#f0f4f7);--muted:light-dark(#5c6975,#b2c0cd);--line:light-dark(#e1e5e8,#3c4a56);--brand:light-dark(#c44f1b,#f2b087);--onbrand:light-dark(#fff,#381706);--soft:light-dark(#fcf0e6,#3c3028);--accent:light-dark(#a64117,#efac81);--rail:light-dark(#17212b,#0f171e);--railmuted:#b8c3cc;--focus:#da9060}
#branch-studios .rail{background:var(--rail);color:var(--railtext);padding:22px 8px 14px;display:flex;align-items:center;flex-direction:column;gap:18px}
#branch-studios .monogram{display:grid;place-items:center;width:42px;height:42px;border:1px solid #d4e0cf5c;border-radius:14px;font-size:28px;font-weight:700;font-family:Georgia,serif;color:#f5efe3;margin-bottom:7px}
#branch-studios .rail nav{display:flex;flex-direction:column;width:100%;gap:8px}
#branch-studios .rail-button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border:0;background:transparent;border-radius:13px;color:var(--railmuted);min-height:67px;padding:10px 3px;font-size:11px;line-height:1.2}
#branch-studios .rail-button[aria-pressed=true]{background:#dce8d925;color:var(--railtext)}
#branch-studios .rail-foot{margin-top:auto;display:grid;justify-items:center;gap:10px;color:var(--railmuted);font-size:10px;letter-spacing:1px;padding-top:32px}
#branch-studios .rail-foot span:first-child{height:32px;width:32px;background:#ffffff12;border-radius:50%;display:grid;place-items:center;letter-spacing:0;font-size:12px}
#branch-studios .body{min-width:0}
#branch-studios .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#branch-studios .store-name{font-size:19px;letter-spacing:-.6px;font-weight:700;line-height:1.25}
#branch-studios .store-label{margin-top:5px;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}
#branch-studios .identity{display:flex;align-items:center;gap:12px}
#branch-studios .person{border-radius:50%;height:36px;width:36px;display:grid;place-items:center;background:var(--soft);font-size:12px;font-weight:600;color:var(--brand)}
#branch-studios .identity-name{font-size:12px;font-weight:600}
#branch-studios .identity-role{font-size:11px;color:var(--muted)}
#branch-studios .branch-select{max-width:100%;min-width:0;min-height:44px;padding:8px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;font-size:13px}
#branch-studios .work{display:grid;grid-template-columns:minmax(0,1fr) 290px}
#branch-studios .main{min-width:0;padding:24px;background:var(--canvas)}
#branch-studios .page-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
#branch-studios .eyebrow{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:600;color:var(--accent);margin-bottom:5px}
#branch-studios h2{font-size:27px;font-weight:600;line-height:1.3;letter-spacing:-.8px;margin:0}
#branch-studios h3{font-size:16px;font-weight:600;margin:0;line-height:1.45}
#branch-studios .subtitle{font-size:12px;color:var(--muted);margin-top:7px}
#branch-studios .quiet-button{display:inline-flex;gap:6px;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--line);padding:9px 12px;background:var(--panel);color:var(--ink);border-radius:11px;font-size:12px}
#branch-studios .quiet-button:disabled{opacity:.45;cursor:default}
#branch-studios .search-wrap{position:relative;margin-bottom:14px}
#branch-studios .search-wrap&gt;svg{position:absolute;left:14px;top:15px;color:var(--muted);pointer-events:none}
#branch-studios .search{width:100%;min-width:0;min-height:48px;padding:12px 14px 12px 42px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font-size:14px;box-shadow:0 2px 4px #00000002}
#branch-studios input::placeholder{color:var(--muted);opacity:1}
#branch-studios .categories{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
#branch-studios .category{border:0;min-height:44px;display:flex;align-items:center;gap:7px;background:transparent;color:var(--muted);padding:9px 12px;border-radius:10px;font-size:12px}
#branch-studios .category[aria-pressed=true]{background:var(--brand);color:var(--onbrand)}
#branch-studios .products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
#branch-studios .product{min-width:0;border:1px solid var(--line);border-radius:15px;padding:0;background:var(--panel);text-align:left;color:var(--ink);overflow:clip;box-shadow:0 3px 10px #00000003;transition:transform .15s ease,box-shadow .15s ease}
#branch-studios .product:hover{transform:translateY(-2px);box-shadow:0 7px 20px #0000000e}
#branch-studios .photo{display:flex;justify-content:center;align-items:center;position:relative;background:var(--photo);height:150px;overflow:clip}
#branch-studios .sprite{flex:none;display:block;aspect-ratio:1;width:148px;background-image:var(--atlas);background-size:400% 200%;background-repeat:no-repeat}
#branch-studios .product-badge{position:absolute;left:10px;top:10px;padding:4px 7px;font-size:10px;font-weight:600;background:#fffef5;color:#486142;border-radius:6px}

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,

        }
      });

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }

    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)

    if (activeTrigger === trigger || pendingTrigger === trigger) {

    }

    lastPointerWasTouch = false;

    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
