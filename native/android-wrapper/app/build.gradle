plugins {
    id "com.android.application"
}

// Release signing comes from keystore.properties (git-ignored), so every APK built for the
// shop is signed with the same key and installs as an update over the previous one.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace = "com.bigb.pos"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.bigb.pos"
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile = rootProject.file(keystoreProps["storeFile"])
                storePassword = keystoreProps["storePassword"]
                keyAlias = keystoreProps["keyAlias"]
                keyPassword = keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
